name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run validate
      - run: npm run build
        env:
          SITE_URL: https://4173842.xyz
          GITHUB_REPO: codebdbd/aitecommander
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
